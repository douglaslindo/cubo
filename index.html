<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cubo 3×3 3D - Controle com Mouse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene">
    <div class="cube" id="cube">

      <!-- Todos os 27 cubinhos (todas combinações de x,y,z = -1,0,1) -->

      <!-- z = -1 (fundo) -->

      <div class="small-cube" style="--x: 0; --y:-1; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y:-1; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 0; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 0; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 0; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 1; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 1; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 1; --z:-1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <!-- z = 0 (meio) -->
      <div class="small-cube" style="--x:-1; --y:-1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y:-1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y:-1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 0; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 0; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 0; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 1; --z: 0;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <!-- z = 1 (frente) -->
      <div class="small-cube" style="--x:-1; --y:-1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y:-1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y:-1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 0; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 0; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 0; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

      <div class="small-cube" style="--x:-1; --y: 1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 0; --y: 1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>
      <div class="small-cube" style="--x: 1; --y: 1; --z: 1;"><div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div><div class="face top"></div><div class="face bottom"></div></div>

    </div>
  </div>

  <script>
    const cube = document.getElementById('cube');

    let isDragging = false;
    let previousX = 0;
    let previousY = 0;

    let rotX = -25;   // ângulo inicial bom pra visualização
    let rotY =  45;

    function update() {
      cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    update();

    // Mouse
    document.addEventListener('mousedown', e => {
      isDragging = true;
      previousX = e.clientX;
      previousY = e.clientY;
    });

    document.addEventListener('mouseup',   () => { isDragging = false; });
    document.addEventListener('mouseleave', () => { isDragging = false; });

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - previousX;
      const dy = e.clientY - previousY;

      rotY += dx * 0.6;
      rotX -= dy * 0.6;

      rotX = Math.max(-85, Math.min(85, rotX)); // evita virar de ponta-cabeça

      update();

      previousX = e.clientX;
      previousY = e.clientY;
    });

    // Toque (celular)
    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      isDragging = true;
      previousX = e.touches[0].clientX;
      previousY = e.touches[0].clientY;
    }, { passive: false });

    document.addEventListener('touchmove', e => {
      if (!isDragging || e.touches.length !== 1) return;
      e.preventDefault();

      const dx = e.touches[0].clientX - previousX;
      const dy = e.touches[0].clientY - previousY;

      rotY += dx * 0.8;
      rotX -= dy * 0.8;

      rotX = Math.max(-85, Math.min(85, rotX));

      update();

      previousX = e.touches[0].clientX;
      previousY = e.touches[0].clientY;
    }, { passive: false });

    document.addEventListener('touchend', () => { isDragging = false; });
  </script>

</body>
</html>
